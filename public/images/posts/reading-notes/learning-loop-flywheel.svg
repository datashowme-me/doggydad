<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="centerCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="500" fill="url(#bgGrad3)" />

  <!-- Title -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Don't Just Learn, Loop：能力进阶的「刻意学习反馈飞轮」
  </text>
  <text x="480" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    知识输入不等于能力掌握。将每一次工作转变为闭环实验，驱动行为与解决能力发生质变
  </text>

  <!-- Central Hub -->
  <circle cx="480" cy="245" r="90" fill="url(#centerCircle)" stroke="#818cf8" stroke-width="2.5" filter="url(#shadow3)" />
  <text x="480" y="235" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">学习闭环核</text>
  <text x="480" y="255" font-family="sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">能力与行为改变</text>
  <text x="480" y="272" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">不是获取知识，而是解决问题</text>

  <!-- Circular Loop Dashed Guide -->
  <circle cx="480" cy="245" r="160" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6" />

  <!-- 6 Step Cards around circle -->
  <!-- Step 1: Top Center -->
  <g transform="translate(360, 92)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#0284c7" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">明确单点能力目标</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">锁定关键短板，不求大而全</text>
  </g>

  <!-- Step 2: Top Right -->
  <g transform="translate(670, 160)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#059669" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">针对性刻意练习</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">设计高难真实任务集脱离舒适区</text>
  </g>

  <!-- Step 3: Bottom Right -->
  <g transform="translate(670, 280)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#d97706" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">获取即时测量反馈</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">记录准确率、耗时、异常与边界</text>
  </g>

  <!-- Step 4: Bottom Center -->
  <g transform="translate(360, 350)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#db2777" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">客观分析归因偏差</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">挖掘真实失败根因，不做事后合理化</text>
  </g>

  <!-- Step 5: Bottom Left -->
  <g transform="translate(50, 280)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#7c3aed" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">5</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">针对性调整方法</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">一次只改进一个变量，重构设计假设</text>
  </g>

  <!-- Step 6: Top Left -->
  <g transform="translate(50, 160)" filter="url(#shadow3)">
    <rect width="240" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="26" cy="26" r="14" fill="#0284c7" />
    <text x="26" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">6</text>
    <text x="50" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">再次同题验证迁移</text>
    <text x="50" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">在相同测试集上验证能力质变并泛化</text>
  </g>

  <!-- Bottom Principle -->
  <g transform="translate(50, 428)">
    <rect width="860" height="52" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
    <text x="430" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle">
      “工作十年并不自动等于成长十年。唯有经过持续反馈与纠偏的实战经历，才具备复利价值。”
    </text>
    <text x="430" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      检视提问：如果拿不出无教程下独立解题与指标优化的证据，就不算真正掌握了该技能。
    </text>
  </g>
</svg>

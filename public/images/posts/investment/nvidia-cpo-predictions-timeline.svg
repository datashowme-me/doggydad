<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%" style="background:#0f172a; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="460" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">《Beyond CPO》三年兑现时间线（2023–2026）</text>
  <text x="460" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">绿 = 已商业验证 · 蓝 = 实验验证 / 工程披露 · 琥珀 = 研究方向与挑战</text>

  <!-- Legend -->
  <g transform="translate(220, 82)">
    <circle cx="8" cy="8" r="6" fill="#10b981"/>
    <text x="20" y="12" fill="#cbd5e1" font-size="11">已商业验证</text>
    <circle cx="120" cy="8" r="6" fill="#38bdf8"/>
    <text x="132" y="12" fill="#cbd5e1" font-size="11">实验验证</text>
    <circle cx="212" cy="8" r="6" fill="#f59e0b"/>
    <text x="224" y="12" fill="#cbd5e1" font-size="11">研究/挑战</text>
  </g>

  <!-- Timeline axis -->
  <line x1="50" y1="270" x2="870" y2="270" stroke="#334155" stroke-width="2"/>
  <polygon points="870,270 858,264 858,276" fill="#334155"/>

  <!-- Node 1: 2023-02 (top) -->
  <g transform="translate(62, 0)">
    <line x1="28" y1="228" x2="28" y2="270" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#f59e0b"/>
    <g transform="translate(-68, 100)" filter="url(#cardShadow)">
      <rect width="192" height="112" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="20" fill="#fbbf24" font-size="12" font-weight="700">2023-02 · 预言起点</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">《Beyond CPO》论文发表</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">提出 2.5D 光学中介层路线</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">Slow-and-Wide 宽并行接口</text>
      <text x="10" y="96" fill="#cbd5e1" font-size="10.5">JLT：物理可行性仿真验证</text>
    </g>
  </g>

  <!-- Node 2: 2024 (bottom) -->
  <g transform="translate(168, 0)">
    <line x1="28" y1="270" x2="28" y2="312" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#f59e0b"/>
    <g transform="translate(-68, 316)" filter="url(#cardShadow)">
      <rect width="192" height="94" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="20" fill="#fbbf24" font-size="12" font-weight="700">2024 · 低能耗接口</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">0.190 pJ/bit 短距收发器</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">25.2 Gb/s/wire 芯片间互联</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">支持宽并行、低能耗设计</text>
    </g>
  </g>

  <!-- Node 3: 2025-03 (top) -->
  <g transform="translate(274, 0)">
    <line x1="28" y1="228" x2="28" y2="270" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#10b981"/>
    <g transform="translate(-68, 100)" filter="url(#cardShadow)">
      <rect width="192" height="112" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="20" fill="#34d399" font-size="12" font-weight="700">2025-03 · CPO 产品化</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">发布 Spectrum-X / Quantum-X</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">Photonics 交换机</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">102.4T / 115.2T 交换带宽</text>
      <text x="10" y="96" fill="#cbd5e1" font-size="10.5">声明约 3.5 倍能效优势*</text>
    </g>
  </g>

  <!-- Node 4: 2025-08 (bottom) -->
  <g transform="translate(380, 0)">
    <line x1="28" y1="270" x2="28" y2="312" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#38bdf8"/>
    <g transform="translate(-68, 316)" filter="url(#cardShadow)">
      <rect width="192" height="94" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="20" fill="#38bdf8" font-size="12" font-weight="700">2025-08 · 工程披露</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">微环 200 Gb/s/λ PAM4</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">TSMC 合作缓解温度敏感性</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">外置激光源（ELS）设计</text>
    </g>
  </g>

  <!-- Node 5: 2026-02 (top) -->
  <g transform="translate(486, 0)">
    <line x1="28" y1="228" x2="28" y2="270" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#38bdf8"/>
    <g transform="translate(-68, 100)" filter="url(#cardShadow)">
      <rect width="192" height="112" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="20" fill="#38bdf8" font-size="12" font-weight="700">2026-02 · 中介层实验</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">SiON/Si 光学中介层</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">单光纤 400 Gb/s 收发验证</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">光电混合集成工艺可行</text>
      <text x="10" y="96" fill="#cbd5e1" font-size="10.5">发表：Journal of Lightwave Tech.</text>
    </g>
  </g>

  <!-- Node 6: 2026-05 (bottom) -->
  <g transform="translate(592, 0)">
    <line x1="28" y1="270" x2="28" y2="312" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#10b981"/>
    <g transform="translate(-68, 316)" filter="url(#cardShadow)">
      <rect width="192" height="94" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="20" fill="#34d399" font-size="12" font-weight="700">2026-05 · 进入生产</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">Vera Rubin 全面生产爬坡</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">Spectrum-X Ethernet Photonics</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">明确进入生产阶段</text>
    </g>
  </g>

  <!-- Node 7: 2026-07 (top) -->
  <g transform="translate(698, 0)">
    <line x1="28" y1="228" x2="28" y2="270" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#10b981"/>
    <g transform="translate(-68, 100)" filter="url(#cardShadow)">
      <rect width="192" height="112" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="20" fill="#34d399" font-size="12" font-weight="700">2026-07 · 第三方证据</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">TrendForce：CPO 初期出货</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">NVIDIA 向特定伙伴出货</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">Broadcom 51.2T 同步推进</text>
      <text x="10" y="96" fill="#fbbf24" font-size="10.5">良率与封装产能制约扩产</text>
    </g>
  </g>

  <!-- Node 8: 2026-08 (bottom) -->
  <g transform="translate(804, 0)">
    <line x1="28" y1="270" x2="28" y2="312" stroke="#475569" stroke-width="1.5"/>
    <circle cx="28" cy="270" r="6" fill="#f59e0b"/>
    <g transform="translate(-68, 316)" filter="url(#cardShadow)">
      <rect width="192" height="94" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="20" fill="#fbbf24" font-size="12" font-weight="700">2026-08 · 学术综述</text>
      <text x="10" y="42" fill="#e2e8f0" font-size="11">Nature Electronics 综述</text>
      <text x="10" y="60" fill="#cbd5e1" font-size="10.5">热管理、可制造性、标准化</text>
      <text x="10" y="78" fill="#cbd5e1" font-size="10.5">仍是三大核心挑战</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="30" y="452" fill="#64748b" font-size="10.5">* 「3.5 倍能效」为公司公布的特定比较条件下的产品声明，不等同于整个 AI 数据中心能耗降低 3.5 倍。事件来源见文末证据索引 [R1]–[R10]。</text>
  <text x="30" y="470" fill="#64748b" font-size="10.5">时间线位置按季度示意，不代表精确比例。</text>
</svg>
